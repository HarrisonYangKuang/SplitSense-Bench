name: Public interface checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check public commands and submission contracts
        run: python3 -m unittest discover -s tests -v
      - name: Reproduce public evidence table
        run: python3 evidence/reproduce.py
      - name: Verify frozen experiment source provenance
        run: python3 experiments/verify_sources.py
      - name: Verify original forty-instance challenge
        run: python3 evidence/verify_legacy.py

      - name: Recompute paired-history boundary cases
        run: python3 evidence/history_ambiguity.py

      - name: Compare saved independent implementation results
        run: python3 evidence/check_capital_reproduction.py

      - name: Decompose saved candidate-menu effects
        run: python3 evidence/candidate_menu_analysis.py

      - name: Independently audit saved v38 predictions
        run: python3 evidence/check_appliances_predictions.py

      - name: Decompose retained versus common-refit results
        run: python3 evidence/refit_decomposition.py
